<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d2439"/>
      <stop offset="45%" stop-color="#245175"/>
      <stop offset="100%" stop-color="#0d2439"/>
    </linearGradient>
    <linearGradient id="bp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bp)"/>

  <!-- faint blueprint grid -->
  <g stroke="#123a5a" stroke-width="1" opacity="0.30">
    <line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="130" x2="160" y2="580"/><line x1="480" y1="130" x2="480" y2="580"/>
    <line x1="640" y1="130" x2="640" y2="580"/><line x1="1120" y1="130" x2="1120" y2="580"/>
  </g>

  <!-- header -->
  <text x="60" y="70" fill="#eaf7ff" font-size="30" font-weight="700" letter-spacing="1">STARSHIP · MULTI-DOOR PAYLOAD BAY</text>
  <text x="60" y="98" fill="#35e0ff" font-size="15" letter-spacing="3">TECHNICAL SCHEMATIC · DISTRIBUTED-AZIMUTH DEPLOYMENT · REV. A</text>
  <line x1="60" y1="112" x2="1220" y2="112" stroke="#245175" stroke-width="1"/>

  <!-- ===== SIDE PROFILE (left column, own space) ===== -->
  <g transform="translate(300,150)">
    <text x="40" y="-8" text-anchor="middle" fill="#9fc4e0" font-size="13" letter-spacing="2">SIDE PROFILE</text>

    <!-- body -->
    <path d="M0 60 Q40 -34 80 60 L80 430 Q40 470 0 430 Z" fill="url(#steel2)" stroke="#4aa6d6" stroke-width="2"/>
    <g stroke="#2b5f86" stroke-width="1" opacity="0.6">
      <line x1="0" y1="150" x2="80" y2="150"/><line x1="0" y1="230" x2="80" y2="230"/>
      <line x1="0" y1="310" x2="80" y2="310"/><line x1="0" y1="390" x2="80" y2="390"/>
    </g>

    <!-- doors on edges -->
    <rect x="-6" y="118" width="12" height="42" rx="2" fill="#35e0ff" filter="url(#g)"/>
    <rect x="74" y="118" width="12" height="42" rx="2" fill="#35e0ff" filter="url(#g)"/>
    <rect x="-6" y="212" width="11" height="36" rx="2" fill="#f4b53c"/>
    <rect x="75" y="212" width="11" height="36" rx="2" fill="#f4b53c"/>

    <!-- LEFT callouts (well clear of body) -->
    <line x1="-6" y1="139" x2="-150" y2="139" stroke="#35e0ff" stroke-width="1"/>
    <circle cx="-150" cy="139" r="2.5" fill="#35e0ff"/>
    <text x="-158" y="134" text-anchor="end" fill="#35e0ff" font-size="14" letter-spacing="1">DOOR 1</text>
    <text x="-158" y="152" text-anchor="end" fill="#7fa8c4" font-size="11">PORT · PRIMARY</text>

    <line x1="-6" y1="230" x2="-150" y2="230" stroke="#f4b53c" stroke-width="1"/>
    <circle cx="-150" cy="230" r="2.5" fill="#f4b53c"/>
    <text x="-158" y="225" text-anchor="end" fill="#f4b53c" font-size="14" letter-spacing="1">DOOR 3</text>
    <text x="-158" y="243" text-anchor="end" fill="#7fa8c4" font-size="11">UP-PORT · STANDBY</text>

    <!-- RIGHT callouts (well clear of body) -->
    <line x1="86" y1="139" x2="230" y2="139" stroke="#35e0ff" stroke-width="1"/>
    <circle cx="230" cy="139" r="2.5" fill="#35e0ff"/>
    <text x="238" y="134" fill="#35e0ff" font-size="14" letter-spacing="1">DOOR 2</text>
    <text x="238" y="152" fill="#7fa8c4" font-size="11">STARBOARD · PRIMARY</text>

    <line x1="86" y1="230" x2="230" y2="230" stroke="#f4b53c" stroke-width="1"/>
    <circle cx="230" cy="230" r="2.5" fill="#f4b53c"/>
    <text x="238" y="225" fill="#f4b53c" font-size="14" letter-spacing="1">DOOR 4</text>
    <text x="238" y="243" fill="#7fa8c4" font-size="11">UP-STBD · STANDBY</text>

    <!-- caption under vehicle (horizontal, no overlap) -->
    <text x="40" y="452" text-anchor="middle" fill="#7fa8c4" font-size="11" letter-spacing="2">PAYLOAD SECTION</text>
  </g>

  <!-- ===== CROSS-SECTION (right column) ===== -->
  <g transform="translate(910,330)">
    <text x="0" y="-160" text-anchor="middle" fill="#9fc4e0" font-size="13" letter-spacing="2">CROSS-SECTION · AZIMUTH VIEW</text>
    <circle r="130" fill="#0d2439" stroke="#4aa6d6" stroke-width="2"/>
    <circle r="100" fill="none" stroke="#1d4d70" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#1d4d70" stroke-width="1"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#1d4d70" stroke-width="1"/>
    <text x="0" y="-36" text-anchor="middle" fill="#dbe9f7" font-size="14" font-weight="700" letter-spacing="1">STARSHIP</text>
    <text x="0" y="24" text-anchor="middle" fill="#7fa8c4" font-size="12">&#8960; ~9 m</text>
    <text x="64" y="-8" text-anchor="middle" fill="#5f88a6" font-size="10">R ~4.5 m</text>

    <!-- doors around circumference -->
    <g transform="rotate(180)"><rect x="122" y="-21" width="14" height="42" rx="2" fill="#35e0ff" filter="url(#g)"/></g>
    <g><rect x="122" y="-21" width="14" height="42" rx="2" fill="#35e0ff" filter="url(#g)"/>
       <line x1="140" y1="0" x2="178" y2="0" stroke="#35e0ff" stroke-width="1.5" stroke-dasharray="3 3"/>
       <circle cx="190" cy="0" r="9" fill="#eaf7ff" stroke="#35e0ff" stroke-width="2"/></g>
    <g transform="rotate(-135)"><rect x="120" y="-19" width="13" height="40" rx="2" fill="#f4b53c"/></g>
    <g transform="rotate(-45)"><rect x="120" y="-19" width="13" height="40" rx="2" fill="#f4b53c"/></g>

    <!-- short door tags, spaced off the rim -->
    <text x="-150" y="4" text-anchor="end" fill="#35e0ff" font-size="11">D1</text>
    <text x="212" y="4" fill="#35e0ff" font-size="11">D2 · deploy</text>
    <text x="-104" y="-96" text-anchor="end" fill="#f4b53c" font-size="11">D3</text>
    <text x="104" y="-96" fill="#f4b53c" font-size="11">D4</text>
  </g>

  <!-- ===== STAT CHIPS (bottom) ===== -->
  <g transform="translate(60,600)">
    <g>
      <rect x="0" y="0" width="270" height="76" rx="8" fill="#0c243a" stroke="#245175" stroke-width="1"/>
      <text x="16" y="32" fill="#35e0ff" font-size="26" font-weight="700">4</text>
      <text x="52" y="28" fill="#cfe4f5" font-size="13">INDEPENDENT DOORS</text>
      <text x="52" y="47" fill="#7fa8c4" font-size="11">2 primary · 2 standby</text>
      <text x="16" y="64" fill="#7fa8c4" font-size="11">each with own rail + actuator</text>
    </g>
    <g transform="translate(292,0)">
      <rect x="0" y="0" width="270" height="76" rx="8" fill="#0c243a" stroke="#245175" stroke-width="1"/>
      <text x="16" y="32" fill="#35e0ff" font-size="22" font-weight="700">0</text>
      <text x="44" y="28" fill="#cfe4f5" font-size="13">MISSION LOSS</text>
      <text x="16" y="50" fill="#7fa8c4" font-size="11">single point of failure removed</text>
      <text x="16" y="66" fill="#7fa8c4" font-size="11">debris hit &#8594; reroute to alt door</text>
    </g>
    <g transform="translate(584,0)">
      <rect x="0" y="0" width="270" height="76" rx="8" fill="#0c243a" stroke="#245175" stroke-width="1"/>
      <text x="16" y="32" fill="#35e0ff" font-size="22" font-weight="700">9 m</text>
      <text x="70" y="28" fill="#cfe4f5" font-size="13">AZIMUTH OFFSET</text>
      <text x="16" y="50" fill="#7fa8c4" font-size="11">negligible at 26,000+ km/h</text>
      <text x="16" y="66" fill="#7fa8c4" font-size="11">no attitude penalty · no fuel cost</text>
    </g>
    <g transform="translate(876,0)">
      <rect x="0" y="0" width="284" height="76" rx="8" fill="#0c243a" stroke="#245175" stroke-width="1"/>
      <text x="16" y="30" fill="#35e0ff" font-size="16" font-weight="700">RETRACT · INSPECT · REDEPLOY</text>
      <text x="16" y="50" fill="#7fa8c4" font-size="11">full in-flight recovery path</text>
      <text x="16" y="66" fill="#7fa8c4" font-size="11">onboard-camera damage check</text>
    </g>
  </g>

  <line x1="60" y1="694" x2="1220" y2="694" stroke="#245175" stroke-width="1"/>
  <text x="60" y="712" fill="#6f93b0" font-size="12">THE EQUATION AGENCY LLC · Miami-Dade County, FL</text>
  <text x="640" y="712" text-anchor="middle" fill="#6f93b0" font-size="12">We Don't Just Automate. We Build Intelligence.</text>
  <text x="1220" y="712" text-anchor="end" fill="#35e0ff" font-size="13" font-weight="700" letter-spacing="1">theequationagencyllc.com</text>
</svg>
