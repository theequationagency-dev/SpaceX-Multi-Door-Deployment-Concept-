<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1830"/>
      <stop offset="100%" stop-color="#060b18"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7ba6"/>
    </marker>
  </defs>
  <rect width="1280" height="420" fill="url(#bg2)"/>

  <text x="60" y="60" fill="#eaf2ff" font-size="30" font-weight="700">Contingency Mode — Graceful Degradation</text>
  <text x="60" y="90" fill="#7fb2ff" font-size="18">Failure on one door never means total mission loss</text>

  <!-- steps -->
  <g>
    <!-- step 1 -->
    <g transform="translate(60,150)">
      <rect width="200" height="170" rx="12" fill="#171f36" stroke="#ff5d6c" stroke-width="2"/>
      <circle cx="100" cy="52" r="26" fill="#2a1420" stroke="#ff5d6c" stroke-width="2"/>
      <text x="100" y="60" text-anchor="middle" font-size="26">&#9888;</text>
      <text x="100" y="108" text-anchor="middle" fill="#ffd7db" font-size="16" font-weight="700">Debris strike</text>
      <text x="100" y="132" text-anchor="middle" fill="#c6d3e8" font-size="14">on Door 1 rail</text>
      <text x="100" y="154" text-anchor="middle" fill="#8ea6c8" font-size="13">detected</text>
    </g>
    <line x1="270" y1="235" x2="308" y2="235" stroke="#5b7ba6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 2 -->
    <g transform="translate(318,150)">
      <rect width="200" height="170" rx="12" fill="#171f36" stroke="#f4b53c" stroke-width="2"/>
      <text x="100" y="60" text-anchor="middle" font-size="26">&#8630;</text>
      <text x="100" y="108" text-anchor="middle" fill="#ffe9c2" font-size="16" font-weight="700">Retract</text>
      <text x="100" y="132" text-anchor="middle" fill="#c6d3e8" font-size="14">satellite pulled</text>
      <text x="100" y="154" text-anchor="middle" fill="#8ea6c8" font-size="13">back from Door 1</text>
    </g>
    <line x1="528" y1="235" x2="566" y2="235" stroke="#5b7ba6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 3 -->
    <g transform="translate(576,150)">
      <rect width="200" height="170" rx="12" fill="#171f36" stroke="#7fb2ff" stroke-width="2"/>
      <text x="100" y="62" text-anchor="middle" font-size="26">&#8644;</text>
      <text x="100" y="108" text-anchor="middle" fill="#d5e6ff" font-size="16" font-weight="700">Reroute</text>
      <text x="100" y="132" text-anchor="middle" fill="#c6d3e8" font-size="14">transfer to Door 2</text>
      <text x="100" y="154" text-anchor="middle" fill="#8ea6c8" font-size="13">or Door 3 rail</text>
    </g>
    <line x1="786" y1="235" x2="824" y2="235" stroke="#5b7ba6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 4 -->
    <g transform="translate(834,150)">
      <rect width="200" height="170" rx="12" fill="#171f36" stroke="#7fb2ff" stroke-width="2"/>
      <text x="100" y="62" text-anchor="middle" font-size="26">&#128247;</text>
      <text x="100" y="108" text-anchor="middle" fill="#d5e6ff" font-size="16" font-weight="700">Inspect</text>
      <text x="100" y="132" text-anchor="middle" fill="#c6d3e8" font-size="14">onboard camera</text>
      <text x="100" y="154" text-anchor="middle" fill="#8ea6c8" font-size="13">confirm no damage</text>
    </g>
    <line x1="1044" y1="235" x2="1082" y2="235" stroke="#5b7ba6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 5 -->
    <g transform="translate(1080,150)">
      <rect width="140" height="170" rx="12" fill="#12271d" stroke="#20e0c8" stroke-width="2"/>
      <text x="70" y="62" text-anchor="middle" font-size="26">&#10003;</text>
      <text x="70" y="108" text-anchor="middle" fill="#c7fff4" font-size="16" font-weight="700">Deploy</text>
      <text x="70" y="132" text-anchor="middle" fill="#c6d3e8" font-size="14">Mission</text>
      <text x="70" y="154" text-anchor="middle" fill="#8ea6c8" font-size="13">continues</text>
    </g>
  </g>

  <text x="60" y="392" fill="#5f7699" font-size="13">Full retract, inspect &amp; redeploy capability &#183; no payload loss &#183; The Equation Agency LLC</text>
</svg>
