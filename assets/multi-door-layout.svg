<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#12233f"/>
      <stop offset="100%" stop-color="#050a16"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a63"/>
      <stop offset="100%" stop-color="#1b2740"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#space)"/>
  <!-- starfield -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="90" r="1.4"/><circle cx="240" cy="180" r="1"/><circle cx="1030" cy="70" r="1.6"/>
    <circle cx="1150" cy="160" r="1"/><circle cx="90" cy="360" r="1.2"/><circle cx="1180" cy="420" r="1.3"/>
    <circle cx="70" cy="520" r="1"/><circle cx="1120" cy="560" r="1.5"/><circle cx="300" cy="560" r="1"/>
    <circle cx="980" cy="520" r="1.1"/><circle cx="200" cy="470" r="0.9"/><circle cx="1080" cy="300" r="1"/>
  </g>

  <!-- Title -->
  <text x="60" y="66" fill="#eaf2ff" font-size="34" font-weight="700">Distributed Multi-Door Deployment System</text>
  <text x="60" y="98" fill="#7fb2ff" font-size="19" font-weight="500">Starship payload bay — fuselage cross-section (view along vehicle axis)</text>

  <!-- Fuselage cross section -->
  <g transform="translate(640,340)">
    <circle r="188" fill="url(#hull)" stroke="#5b7196" stroke-width="3"/>
    <circle r="150" fill="none" stroke="#3a4a63" stroke-width="1.5" stroke-dasharray="5 7"/>
    <text x="0" y="-6" text-anchor="middle" fill="#dbe6f7" font-size="26" font-weight="700" letter-spacing="2">STARSHIP</text>
    <text x="0" y="22" text-anchor="middle" fill="#8ea6c8" font-size="15">payload bay</text>
    <text x="0" y="44" text-anchor="middle" fill="#8ea6c8" font-size="14">&#8960; ~9 m fuselage</text>

    <!-- center radius marker -->
    <line x1="0" y1="0" x2="188" y2="0" stroke="#4a5d7d" stroke-width="1" opacity="0.5"/>

    <!-- DOOR 1  Port / west (left) : PRIMARY -->
    <g transform="rotate(180)">
      <rect x="182" y="-26" width="16" height="52" rx="3" fill="#20e0c8" filter="url(#glow)"/>
      <line x1="198" y1="0" x2="250" y2="0" stroke="#20e0c8" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <!-- DOOR 2  Starboard / east (right) : PRIMARY  + deploying satellite -->
    <g>
      <rect x="182" y="-26" width="16" height="52" rx="3" fill="#20e0c8" filter="url(#glow)"/>
      <line x1="198" y1="0" x2="300" y2="0" stroke="#20e0c8" stroke-width="2" stroke-dasharray="4 4"/>
      <g transform="translate(300,0)">
        <rect x="-11" y="-11" width="22" height="22" rx="2" fill="#eaf2ff" stroke="#20e0c8" stroke-width="2"/>
        <rect x="-26" y="-6" width="12" height="12" fill="#2b6fff"/>
        <rect x="14" y="-6" width="12" height="12" fill="#2b6fff"/>
      </g>
    </g>
    <!-- DOOR 3  Upper port (upper-left) : STANDBY -->
    <g transform="rotate(-135)">
      <rect x="182" y="-24" width="15" height="48" rx="3" fill="#f4b53c"/>
      <line x1="197" y1="0" x2="245" y2="0" stroke="#f4b53c" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <!-- DOOR 4  Upper starboard (upper-right) : STANDBY -->
    <g transform="rotate(-45)">
      <rect x="182" y="-24" width="15" height="48" rx="3" fill="#f4b53c"/>
      <line x1="197" y1="0" x2="245" y2="0" stroke="#f4b53c" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- Door labels -->
  <text x="300" y="346" text-anchor="end" fill="#20e0c8" font-size="18" font-weight="700">Door 1 &#183; Port</text>
  <text x="300" y="368" text-anchor="end" fill="#8ea6c8" font-size="13">primary &#183; independent rail</text>

  <text x="980" y="300" fill="#20e0c8" font-size="18" font-weight="700">Door 2 &#183; Starboard</text>
  <text x="980" y="322" fill="#8ea6c8" font-size="13">primary &#183; satellite deploying &#8594;</text>

  <text x="430" y="150" text-anchor="end" fill="#f4b53c" font-size="18" font-weight="700">Door 3 &#183; Upper Port</text>
  <text x="430" y="172" text-anchor="end" fill="#8ea6c8" font-size="13">standby redundancy</text>

  <text x="852" y="150" fill="#f4b53c" font-size="18" font-weight="700">Door 4 &#183; Upper Starboard</text>
  <text x="852" y="172" fill="#8ea6c8" font-size="13">standby redundancy</text>

  <!-- Legend -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#20e0c8"/>
    <text x="26" y="14" fill="#cfe0f7" font-size="15">Primary operational doors</text>
    <rect x="270" y="0" width="18" height="18" rx="3" fill="#f4b53c"/>
    <text x="296" y="14" fill="#cfe0f7" font-size="15">Standby redundancy doors</text>
    <text x="560" y="14" fill="#8ea6c8" font-size="15">Independent rails &#183; multi-azimuth &#183; graceful degradation</text>
  </g>

  <text x="1220" y="98" text-anchor="end" fill="#5f7699" font-size="13">The Equation Agency LLC &#183; Miami-Dade, FL</text>
</svg>
